name: Actualizar velas (manual)

# CTO, 7-oct-2026: SIN disparo programado. Desde el equipo de trabajo el
# proveedor responde 429 a la primera peticion; se prueba desde Actions, con
# otra IP de salida, y solo a mano (Actions → este workflow → Run workflow):
#   · modo sonda: scripts/sonda-proveedor.js con UN dia: la entrada «dia»
#     (PAR:AAAA-MM-DD; vacia = EURUSD de ayer), con sus cabeceras de limite.
#     No lee ni escribe Storage y este paso NO recibe la clave de servicio.
#   · modo recuperar: scripts/actualizar-diario.js --subir --pares <PAR>, con
#     UN solo par por ejecucion; publica .json.gz como todos los escritores
#     (CTO 9-oct: un solo formato). Con «objetivo»
#     (PAR:AAAA-MM-DD,...), el job dice si cada dia quedo completo y sale
#     distinto de 0 si alguno no (Astra M-03, CTO 7-oct).
# Ninguna clave ni URL en el log. Desde aqui no se libera ningun cerrojo.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'sonda (EURUSD 2026-07-20, sin Storage ni clave) o recuperar (un par)'
        required: true
        type: choice
        options:
          - sonda
          - recuperar
        default: sonda
      dia:
        description: 'Solo en sonda: UN dia, PAR:AAAA-MM-DD (vacio = EURUSD de ayer)'
        required: false
        type: string
        default: ''
      pares:
        description: 'Solo en recuperar: UN par, p. ej. AUDUSD'
        required: false
        type: string
        default: ''
      objetivo:
        description: 'Solo en recuperar, opcional: dias que tienen que quedar completos, PAR:AAAA-MM-DD separados por comas (del mismo par)'
        required: false
        type: string
        default: ''

concurrency:
  group: actualizar-velas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Sonda del proveedor (un dia, sin Storage ni clave)
        if: ${{ inputs.modo == 'sonda' }}
        env:
          DIA: ${{ inputs.dia }}
        run: |
          # >>> valida-dia
          if [ -z "$DIA" ]; then DIA="EURUSD:$(node -e 'console.log(new Date(Date.now() - 864e5).toISOString().slice(0, 10))')"; fi
          # mes 01-12 y dia 01-31 (Astra MER-R2); el script comprueba ademas el calendario
          if ! [[ "$DIA" =~ ^[A-Z]{6}:[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]]; then
            echo "dia: UN dia, PAR:AAAA-MM-DD (p. ej. EURUSD:2026-10-06). No se ha pedido nada."
            exit 4
          fi
          # <<< valida-dia
          set +e
          node scripts/sonda-proveedor.js --cabeceras "$DIA"
          c=$?
          echo "Codigo de salida: $c"
          exit $c

      - name: Recuperar un par
        if: ${{ inputs.modo == 'recuperar' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PARES: ${{ inputs.pares }}
          OBJETIVO: ${{ inputs.objetivo }}
        run: |
          # >>> valida-pares
          if ! [[ "$PARES" =~ ^[A-Z]{6}$ ]]; then
            echo "pares: hace falta UN solo par, en mayusculas (p. ej. AUDUSD). No se ha hecho nada."
            exit 4
          fi
          # <<< valida-pares
          # >>> valida-objetivo
          # mes 01-12 y dia 01-31 (Astra MER-R2); el script comprueba ademas el calendario
          if [ -n "$OBJETIVO" ] && ! [[ "$OBJETIVO" =~ ^${PARES}:[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])(,${PARES}:[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]))*$ ]]; then
            echo "objetivo: PAR:AAAA-MM-DD separados por comas, todos del par pedido. No se ha hecho nada."
            exit 4
          fi
          # <<< valida-objetivo
          set +e
          node scripts/actualizar-diario.js --subir --pares "$PARES" ${OBJETIVO:+--objetivo "$OBJETIVO"}
          c=$?
          echo "Codigo de salida: $c"
          exit $c
